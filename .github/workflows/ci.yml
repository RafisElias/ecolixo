name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: ecolixo
          POSTGRES_PASSWORD: ecolixo
          POSTGRES_DB: ecolixo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecolixo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://ecolixo:ecolixo@localhost:5432/ecolixo
      SECRET_KEY: ci-only-secret
      UPLOAD_DIR: /tmp/ecolixo-uploads
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Usa a versão do pnpm fixada em "packageManager".
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci src/
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  # Publica na VPS depois que lint e testes passam num push para a main.
  # A chave só executa ~/deploy.sh no servidor (comando forçado no
  # authorized_keys): git pull --ff-only, rebuild e checagem de saúde.
  deploy:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://ecolixo.duckdns.org
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy na VPS
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "rafael@$HOST"
