# Produção: Caddy (HTTPS + frontend estático) na frente; API e banco só na rede interna.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: ecolixo-prod

services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ecolixo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ecolixo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecolixo"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # Roda como usuário sem privilégios (Dockerfile); não precisa de capabilities.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ecolixo:${POSTGRES_PASSWORD}@db:5432/ecolixo
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY}
      GESTOR_REGISTRATION_CODE: ${GESTOR_REGISTRATION_CODE:-}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      UPLOAD_DIR: /app/uploads
      # Mesma origem via Caddy: sem CORS e sem documentação pública.
      CORS_ORIGINS: ""
      ENABLE_DOCS: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Caddy só precisa abrir as portas 80/443.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
